name: Build and Deploy Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: hinchmart

jobs:
  build-push-deploy:
    name: Build, Push to ECR and Deploy to EC2
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Java 21
      # ============================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ============================================================
      # 3. Build Spring Boot JAR
      # ============================================================
      - name: Build Spring Boot JAR
        shell: bash
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            ./mvnw -B clean package -DskipTests
          else
            mvn -B clean package -DskipTests
          fi

      # ============================================================
      # 4. Configure AWS credentials
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================================
      # 5. Login to Amazon ECR
      # ============================================================
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================================
      # 6. Build and push Docker image
      # ============================================================
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-2.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}

        shell: bash

        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"

          echo "Building Docker image..."

          docker build \
            --tag "$IMAGE:$IMAGE_TAG" \
            --tag "$IMAGE:latest" \
            .

          echo "Pushing image with commit tag..."

          docker push "$IMAGE:$IMAGE_TAG"

          echo "Pushing latest image..."

          docker push "$IMAGE:latest"

          echo "Docker image pushed successfully:"
          echo "$IMAGE:$IMAGE_TAG"

      # ============================================================
      # 7. Deploy to EC2
      # ============================================================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        env:

          # --------------------------------------------------------
          # AWS
          # --------------------------------------------------------
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

          # --------------------------------------------------------
          # Database
          # --------------------------------------------------------
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DDL_AUTO: ${{ secrets.DB_DDL_AUTO }}

          # --------------------------------------------------------
          # JWT
          # --------------------------------------------------------
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION_MS }}
          JWT_REFRESH_EXPIRATION_MS: ${{ secrets.JWT_REFRESH_EXPIRATION_MS }}

        with:

          # --------------------------------------------------------
          # EC2 connection
          # --------------------------------------------------------
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          # --------------------------------------------------------
          # Pass environment variables to SSH script
          # --------------------------------------------------------
          envs: AWS_ACCOUNT_ID,DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,DB_DDL_AUTO,JWT_SECRET,JWT_EXPIRATION_MS,JWT_REFRESH_EXPIRATION_MS

          script_stop: true

          script: |

            set -eu

            # ======================================================
            # ECR CONFIGURATION
            # ======================================================

            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-2.amazonaws.com"
            IMAGE="${ECR_REGISTRY}/hinchmart:latest"

            echo "=========================================="
            echo "Logging into Amazon ECR..."
            echo "=========================================="

            aws ecr get-login-password \
              --region ap-south-2 \
              | docker login \
                  --username AWS \
                  --password-stdin \
                  "${ECR_REGISTRY}"


            # ======================================================
            # PULL LATEST IMAGE
            # ======================================================

            echo "=========================================="
            echo "Pulling latest Docker image..."
            echo "=========================================="

            docker pull "${IMAGE}"


            # ======================================================
            # STOP EXISTING CONTAINER
            # ======================================================

            echo "=========================================="
            echo "Stopping existing container..."
            echo "=========================================="

            docker stop hinchmart 2>/dev/null || true
            docker rm hinchmart 2>/dev/null || true


            # ======================================================
            # START NEW CONTAINER
            # ======================================================

            echo "=========================================="
            echo "Starting new HinchMart container..."
            echo "=========================================="

            docker run -d \
              --name hinchmart \
              --restart unless-stopped \
              -p 9000:9000 \
              \
              -e PORT=9000 \
              \
              -e DB_HOST="${DB_HOST}" \
              -e DB_PORT="${DB_PORT}" \
              -e DB_NAME="${DB_NAME}" \
              -e DB_USERNAME="${DB_USERNAME}" \
              -e DB_PASSWORD="${DB_PASSWORD}" \
              -e DB_DDL_AUTO="${DB_DDL_AUTO}" \
              \
              -e JWT_SECRET="${JWT_SECRET}" \
              -e JWT_EXPIRATION_MS="${JWT_EXPIRATION_MS}" \
              -e JWT_REFRESH_EXPIRATION_MS="${JWT_REFRESH_EXPIRATION_MS}" \
              \
              "${IMAGE}"


            # ======================================================
            # VERIFY CONTAINER STARTED
            # ======================================================

            echo "=========================================="
            echo "Checking Docker container..."
            echo "=========================================="

            sleep 5

            if ! docker ps --format '{{.Names}}' | grep -q '^hinchmart$'; then

              echo "Container failed to start."

              echo "Recent container logs:"
              docker logs --tail 150 hinchmart || true

              exit 1

            fi


            # ======================================================
            # VERIFY JWT ENVIRONMENT
            # ======================================================

            echo "=========================================="
            echo "Checking JWT configuration..."
            echo "=========================================="

            if docker exec hinchmart sh -c \
              'test -n "$JWT_SECRET"'; then

              echo "JWT_SECRET is SET"

            else

              echo "ERROR: JWT_SECRET is NOT SET"

              docker logs --tail 150 hinchmart || true

              exit 1

            fi


            echo "JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}"
            echo "JWT_REFRESH_EXPIRATION_MS=${JWT_REFRESH_EXPIRATION_MS}"


            # ======================================================
            # PRODUCTION HEALTH CHECK
            # ======================================================

            HEALTH_CHECK_URL="https://api.hinchmart.com/actuator/health"

            HEALTH_CHECK_TIMEOUT_SECONDS=600
            HEALTH_CHECK_INTERVAL_SECONDS=5

            HEALTH_CHECK_ATTEMPTS=$((HEALTH_CHECK_TIMEOUT_SECONDS / HEALTH_CHECK_INTERVAL_SECONDS))


            echo "=========================================="
            echo "Production health check"
            echo "=========================================="

            echo "URL: ${HEALTH_CHECK_URL}"
            echo "Timeout: ${HEALTH_CHECK_TIMEOUT_SECONDS} seconds"


            # ======================================================
            # WAIT FOR APPLICATION
            # ======================================================

            for attempt in $(seq 1 "${HEALTH_CHECK_ATTEMPTS}"); do

              HTTP_STATUS=$(curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                --max-time 10 \
                "${HEALTH_CHECK_URL}" || true)


              if [ "${HTTP_STATUS}" = "200" ]; then

                echo "=========================================="
                echo "Health check PASSED"
                echo "=========================================="

                echo "HinchMart backend is running."
                echo "API: https://api.hinchmart.com"

                docker image prune --force
                docker container prune --force

                exit 0

              fi


              echo "Health check attempt ${attempt}/${HEALTH_CHECK_ATTEMPTS}"
              echo "HTTP status: ${HTTP_STATUS}"

              sleep "${HEALTH_CHECK_INTERVAL_SECONDS}"

            done


            # ======================================================
            # HEALTH CHECK FAILED
            # ======================================================

            echo "=========================================="
            echo "HEALTH CHECK FAILED"
            echo "=========================================="

            echo "Container status:"
            docker ps -a --filter name=hinchmart

            echo ""
            echo "Recent container logs:"
            echo "=========================================="

            docker logs --tail 150 hinchmart || true

            echo ""
            echo "=========================================="
            echo "Docker inspect:"
            echo "=========================================="

            docker inspect hinchmart \
              --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}}' \
              || true

            exit 1