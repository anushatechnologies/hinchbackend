# ==============================================================================
# HINCHMART B2B MARKETPLACE - PRODUCTION CONFIGURATION
# ==============================================================================

# ==============================================================================
# SERVER CONFIGURATION
# ==============================================================================
server.port=${PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}

# ==============================================================================
# SPRING APPLICATION
# ==============================================================================
spring.application.name=hinchmart-backend


# ==============================================================================
# SPRING BOOT ACTUATOR MONITORING
# ==============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Do not let Gmail SMTP failure make the entire application unhealthy
management.health.mail.enabled=false


# ==============================================================================
# DATABASE CONFIGURATION - MYSQL / RDS
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hinchmart_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==============================================================================
# JPA / HIBERNATE
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==============================================================================
# JACKSON JSON SERIALIZATION
# ==============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null


# ==============================================================================
# JWT AUTHENTICATION
# ==============================================================================
# IMPORTANT: Set JWT_SECRET as an environment variable in production.
hinchmart.jwt.secret=${JWT_SECRET}

hinchmart.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

hinchmart.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}


# ==============================================================================
# OTP VERIFICATION
# ==============================================================================
hinchmart.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
hinchmart.otp.mock-mode=${OTP_MOCK_MODE:false}
hinchmart.otp.default-test-code=${OTP_DEFAULT_TEST_CODE:123456}


# ==============================================================================
# EMAIL / SMTP
# ==============================================================================
hinchmart.mail.enabled=${MAIL_ENABLED:true}
hinchmart.mail.from-name=${MAIL_FROM_NAME:HinchMart Verification}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ==============================================================================
# SMS
# ==============================================================================
hinchmart.sms.enabled=${SMS_ENABLED:true}
hinchmart.sms.provider=${SMS_PROVIDER:FAST2SMS}

# Fast2SMS
hinchmart.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}

# Twilio
hinchmart.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
hinchmart.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
hinchmart.sms.twilio.from-phone=${TWILIO_FROM_PHONE:}

# MSG91
hinchmart.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
hinchmart.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}


# ==============================================================================
# CORS
# ==============================================================================
# GitHub Actions / EC2 should provide CORS_ALLOWED_ORIGINS.
#
# Current frontend:
# http://localhost:5173
# http://localhost:5174
# http://localhost:5175
#
hinchmart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}


# ==============================================================================
# DATA SEEDING
# ==============================================================================
hinchmart.seed.enabled=${SEED_ENABLED:true}


# ==============================================================================
# RAZORPAY
# ==============================================================================
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=${RAZORPAY_CURRENCY:INR}
razorpay.company-name=${RAZORPAY_COMPANY_NAME:HinchMart}


# ==============================================================================
# SWAGGER / OPENAPI
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true


# ==============================================================================
# LOGGING
# ==============================================================================
logging.level.root=INFO
logging.level.com.hinchmart=INFO

logging.level.org.springframework.aop.framework.CglibAopProxy=ERROR
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=WARN

logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%5p]) %clr(%-35logger{35}){cyan} : %msg%n