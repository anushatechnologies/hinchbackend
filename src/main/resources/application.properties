# ==============================================================================
# HINCHMART B2B MARKETPLACE - CONFIGURATION (MYSQL SQL DATABASE)
# ==============================================================================

# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}

# Spring Application Name
spring.application.name=hinchmart-backend

# ==============================================================================
# DATABASE CONFIGURATION (MySQL SQL Database)
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hinchmart_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pavan@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# JACKSON JSON SERIALIZATION
# ==============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# ==============================================================================
# JWT AUTHENTICATION SETTINGS (Member 1)
# ==============================================================================
# HMAC-SHA256 Base64-encoded 256-bit secret key
hinchmart.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Access token expiration in milliseconds (24h = 86,400,000 ms)
hinchmart.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Refresh token expiration in milliseconds (30 days = 2,592,000,000 ms)
hinchmart.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# ==============================================================================
# OTP VERIFICATION SETTINGS
# ==============================================================================
hinchmart.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
hinchmart.otp.mock-mode=${OTP_MOCK_MODE:false}
hinchmart.otp.default-test-code=${OTP_DEFAULT_TEST_CODE:123456}

# ==============================================================================
# EMAIL NOTIFICATIONS & REAL OTP DISPATCH (SMTP / GMAIL / SENDGRID)
# ==============================================================================
hinchmart.mail.enabled=${MAIL_ENABLED:true}
hinchmart.mail.from-name=${MAIL_FROM_NAME:HinchMart Verification}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:anushatechnologies03@gmail.com}
spring.mail.password=${MAIL_PASSWORD:nlyvuxzdfzptvfvv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================================
# REAL MOBILE SMS GATEWAY SETTINGS (FAST2SMS / TWILIO / MSG91)
# ==============================================================================
hinchmart.sms.enabled=${SMS_ENABLED:true}
hinchmart.sms.provider=${SMS_PROVIDER:FAST2SMS}

# Fast2SMS (Instant Indian SMS Gateway: https://www.fast2sms.com)
hinchmart.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}

# Twilio (Global & Indian SMS Gateway: https://www.twilio.com)
hinchmart.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
hinchmart.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
hinchmart.sms.twilio.from-phone=${TWILIO_FROM_PHONE:}

# MSG91 (Indian Enterprise SMS: https://msg91.com)
hinchmart.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
hinchmart.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}

# ==============================================================================
# CORS (CROSS-ORIGIN RESOURCE SHARING)
# ==============================================================================
hinchmart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ==============================================================================
# DATA SEEDING (Auto-seeds Categories, Brands, Tata Tiscon with Bulk Tiers, Demo Users)
# ==============================================================================
hinchmart.seed.enabled=true

# ==============================================================================
# RAZORPAY PAYMENT GATEWAY SETTINGS
# ==============================================================================
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_live_TO6q7NUVnPM6bA}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:pRMq2obuE51XoJlH3NDyUl9w}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=${RAZORPAY_CURRENCY:INR}
razorpay.company-name=${RAZORPAY_COMPANY_NAME:HinchMart}

# ==============================================================================
# SWAGGER / OPENAPI UI DOCUMENTATION
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ==============================================================================
# LOGGING CONFIGURATION (Clean, Business-Transaction Focused)
# ==============================================================================
logging.level.root=INFO
logging.level.com.hinchmart=INFO

# Suppress framework noise and warnings
logging.level.org.springframework.aop.framework.CglibAopProxy=ERROR
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=WARN

# Clean & Readable Console Log Pattern
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%5p]) %clr(%-35logger{35}){cyan} : %msg%n

# ==============================================================================
# SPRING BOOT ACTUATOR CONFIGURATION (Health & Metrics)
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.health.mail.enabled=false


